<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aksh Chat</title>
    <link rel="icon" href="../../chat-logo.png" type="image/png">
    <link rel="stylesheet" href="css/chat.css">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
</head>
<body>
    <div id="app-container" class="loading">
        <!-- Header -->
        <header class="app-header">
            <div class="header-left">
                <button id="menu-toggle" class="icon-btn"><span class="material-icons-outlined">menu</span></button>
                <img src="../../chat-logo.png" alt="Aksh Chat Logo" class="brand-logo">
                <h1 class="brand-title">Aksh Chat</h1>
            </div>
            <div class="header-center">
                <div class="search-bar">
                    <span class="material-icons-outlined">search</span>
                    <input type="text" placeholder="Search in Aksh Chat">
                </div>
            </div>
            <div class="header-right">
                <div class="user-profile" id="user-profile-menu">
                    <img id="user-avatar" src="../../chat-logo.png" alt="User Avatar" class="avatar">
                    <div id="user-status-badge" class="status-badge active"></div>
                </div>
            </div>
        </header>

        <main class="app-main">
            <!-- Sidebar (Spaces & DMs) -->
            <aside id="sidebar" class="sidebar">
                <div class="sidebar-section">
                    <div class="section-header">
                        <h2>Spaces</h2>
                        <button id="add-space-btn" class="icon-btn"><span class="material-icons-outlined">add</span></button>
                    </div>
                    <ul id="spaces-list" class="nav-list">
                        <!-- Spaces injected here -->
                    </ul>
                </div>
                <div class="sidebar-section">
                    <div class="section-header">
                        <h2>Direct Messages</h2>
                        <button id="add-dm-btn" class="icon-btn"><span class="material-icons-outlined">add</span></button>
                    </div>
                    <ul id="dms-list" class="nav-list">
                        <!-- DMs injected here -->
                    </ul>
                </div>
            </aside>

            <!-- Main Chat Area -->
            <section id="main-chat" class="main-chat">
                <div id="chat-header" class="chat-header">
                    <h2 id="current-chat-title">Select a Space or DM</h2>
                    <p id="current-chat-desc" class="chat-desc"></p>
                </div>
                <div id="message-list" class="message-list">
                    <!-- Messages injected here -->
                    <div class="welcome-screen">
                        <img src="../../chat-logo.png" alt="Welcome" class="welcome-logo">
                        <h2>Welcome to Aksh Chat</h2>
                        <p>Select a space or start a direct message.</p>
                    </div>
                </div>
                <div id="message-input-area" class="message-input-area hidden">
                    <div class="input-wrapper">
                        <button class="icon-btn"><span class="material-icons-outlined">add_circle_outline</span></button>
                        <button id="attach-btn" class="icon-btn"><span class="material-icons-outlined">attach_file</span></button>
                        <input type="file" id="attachment-input" accept="image/png, image/jpeg, image/gif, image/webp" class="hidden">
                        <textarea id="message-input" placeholder="Message..." rows="1"></textarea>
                        <button id="send-msg-btn" class="icon-btn primary"><span class="material-icons-outlined">send</span></button>
                    </div>
                </div>
            </section>

            <!-- Thread Drawer -->
            <aside id="thread-drawer" class="thread-drawer closed">
                <div class="thread-header">
                    <h2>Thread</h2>
                    <p id="thread-parent-context"></p>
                    <button id="close-thread-btn" class="icon-btn"><span class="material-icons-outlined">close</span></button>
                </div>
                <div id="thread-parent-message" class="thread-parent-message">
                    <!-- Parent message injected here -->
                </div>
                <div class="thread-divider">
                    <span>Replies</span>
                </div>
                <div id="thread-replies-list" class="thread-replies-list">
                    <!-- Replies injected here -->
                </div>
                <div class="thread-input-area">
                    <div class="input-wrapper">
                        <textarea id="thread-reply-input" placeholder="Reply..." rows="1"></textarea>
                        <button id="send-reply-btn" class="icon-btn primary"><span class="material-icons-outlined">send</span></button>
                    </div>
                </div>
            </aside>
        </main>
        
        <!-- Modals -->
        <div id="auth-modal" class="modal">
            <div class="modal-content">
                <h2>Sign in to Aksh Chat</h2>
                <button id="google-signin-btn" class="btn primary">Sign in with Google</button>
            </div>
        </div>
        
        <!-- Create Space Modal -->
        <div id="create-space-modal" class="modal hidden">
            <div class="modal-content">
                <h2>Create Space</h2>
                <input type="text" id="new-space-name" placeholder="Space Name">
                <textarea id="new-space-desc" placeholder="Description"></textarea>
                <div class="modal-actions">
                    <button id="cancel-create-space" class="btn">Cancel</button>
                    <button id="confirm-create-space" class="btn primary">Create</button>
                </div>
            </div>
        </div>

        <!-- Lightbox Modal -->
        <div id="lightbox-modal" class="lightbox-modal hidden">
            <div class="lightbox-content">
                <span id="close-lightbox" class="close-btn">&times;</span>
                <img id="lightbox-img" src="" alt="Expanded Attachment">
            </div>
        </div>
    </div>

    <!-- Firebase SDKs and App Logic -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
