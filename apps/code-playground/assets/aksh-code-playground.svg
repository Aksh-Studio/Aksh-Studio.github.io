<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" fill="none" role="img" aria-label="Aksh Code Playground Logo">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="bracketLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="bracketRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="akshCenter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0ea5e9" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Logo Mark Container -->
  <g transform="translate(6, 4)">
    <!-- Rounded Shield Background -->
    <rect x="0" y="0" width="40" height="40" rx="10" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.2" />
    <rect x="1" y="1" width="38" height="38" rx="9" fill="none" stroke="rgba(56, 189, 248, 0.15)" stroke-width="1" />
    
    <!-- Code Brackets + Central Apex "A" Symbol -->
    <!-- Left Bracket < -->
    <path d="M14 14 L8 20 L14 26" stroke="url(#bracketLeft)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
    
    <!-- Right Bracket > -->
    <path d="M26 14 L32 20 L26 26" stroke="url(#bracketRight)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
    
    <!-- Stylized Central Apex 'A' / Slash Core -->
    <path d="M20 12 L17 28 M20 12 L23 28 M17.8 23 L22.2 23" stroke="url(#akshCenter)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="20" cy="12" r="1.5" fill="#38bdf8" />
  </g>

  <!-- Wordmark -->
  <g transform="translate(56, 0)">
    <!-- "AKSH" -->
    <text x="0" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="16" font-weight="800" letter-spacing="0.5" fill="#f8fafc">
      AKSH
    </text>
    <circle cx="52" cy="18" r="2.5" fill="#38bdf8" />
    <!-- "CODE" in electric blue -->
    <text x="60" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="16" font-weight="700" letter-spacing="0.5" fill="#38bdf8">
      CODE
    </text>
    <!-- Subtitle: "PLAYGROUND" -->
    <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="10.5" font-weight="600" letter-spacing="2.5" fill="#94a3b8">
      PLAYGROUND
    </text>
  </g>
</svg>
