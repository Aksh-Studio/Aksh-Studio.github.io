1. **Compressed Binary / Corrupted Upload:** The archive provided in the prompt is a binary `.zip` stream where the source code inside `apps/photoshop/` (`index.html`, `css/styles.css`, and the 6 scripts in `js/`) is compressed/deflated and unreadable as plain text[cite: 1]. If these files were committed or deployed in a corrupted state, or if module/global script bindings mismatched during deployment, the application fails to initialize.
2. **Global Scope & Initialization Race Conditions:** In a multi-file vanilla JavaScript architecture (`utils.js`, `history.js`, `layers.js`, `tools.js`, `adjustments.js`, `app.js`)[cite: 1], using ES6 module `import`/`export` without `type="module"` (or vice-versa) or referencing DOM elements before `DOMContentLoaded` breaks the entire app on GitHub Pages.
3. **Canvas Coordinate & High-DPI Scaling Bugs:** Mouse and touch events on zoomable/pannable HTML5 canvases fail to align with the cursor if `getBoundingClientRect()` is not divided by the current zoom scale.
4. **Layer Compositing & History Memory:** Storing raw base64 strings on every mouse move freezes the browser. History states must be captured only on `pointerup` / `mouseup` and layer operations using `ImageData` snapshots.
5. **Service Worker (`sw.js`) & Relative Path Caching:** Hosting under `/apps/photoshop/` on GitHub Pages[cite: 1] requires strictly relative asset paths (`./css/styles.css`, `./js/...`) so the root path `/apps/photoshop/` resolves properly without 404 errors.

                    <span id="status-zoom">100%</span>
                    <button id="btn-zoom-in" title="Zoom In"><i class="fa-solid fa-plus"></i></button>
                    <button id="btn-zoom-reset" title="Reset Zoom">Fit</button>
                </div>
            </div>
        </section>

        <!-- Right Dock Panels -->
        <aside class="right-sidebar">
            <!-- Adjustments Panel -->
            <div class="panel">
                <div class="panel-header">
                    <span><i class="fa-solid fa-sliders"></i> Layer Adjustments</span>
                    <button id="btn-reset-adjustments" class="text-btn" title="Reset Sliders">Reset</button>
                </div>
                <div class="panel-body adjustments-list">
                    <div class="adj-row">
                        <div class="adj-label"><span>Brightness</span><span id="val-brightness">0</span></div>
                        <input type="range" id="adj-brightness" min="-100" max="100" value="0">
                    </div>
                    <div class="adj-row">
                        <div class="adj-label"><span>Contrast</span><span id="val-contrast">0</span></div>
                        <input type="range" id="adj-contrast" min="-100" max="100" value="0">
                    </div>
                    <div class="adj-row">
                        <div class="adj-label"><span>Saturation</span><span id="val-saturation">0</span></div>
                        <input type="range" id="adj-saturation" min="-100" max="100" value="0">
                    </div>
                    <div class="adj-row">
                        <div class="adj-label"><span>Hue Shift</span><span id="val-hue">0°</span></div>
                        <input type="range" id="adj-hue" min="-180" max="180" value="0">
                    </div>
                    <div class="adj-row">
                        <div class="adj-label"><span>Blur</span><span id="val-blur">0px</span></div>
                        <input type="range" id="adj-blur" min="0" max="20" value="0">
                    </div>
                    <button id="btn-apply-adjustments" class="action-btn primary full-width mt-2">
                        <i class="fa-solid fa-wand-magic"></i> Bake into Layer
                    </button>
                </div>
            </div>

            <!-- Layers Panel -->
            <div class="panel layers-panel">
                <div class="panel-header">
                    <span><i class="fa-solid fa-layer-group"></i> Layers</span>
                    <span id="layer-count-badge" class="badge">1</span>
                </div>

                <div class="layer-Global-controls">
                    <div class="blend-row">
                        <select id="layer-blend-mode" title="Blend Mode">
                            <option value="source-over">Normal</option>
                            <option value="multiply">Multiply</option>
                            <option value="screen">Screen</option>
                            <option value="overlay">Overlay</option>
                            <option value="darken">Darken</option>
                            <option value="lighten">Lighten</option>
                            <option value="color-dodge">Color Dodge</option>
                            <option value="color-burn">Color Burn</option>
                            <option value="hard-light">Hard Light</option>
                            <option value="soft-light">Soft Light</option>
                            <option value="difference">Difference</option>
                            <option value="exclusion">Exclusion</option>
                        </select>
                        <div class="layer-opacity-wrap">
                            <label>Op:</label>
                            <input type="number" id="layer-opacity-input" min="0" max="100" value="100">%
                        </div>
                    </div>
                </div>

                <div class="layers-list" id="layers-list">
                    <!-- Populated dynamically by layers.js -->
                </div>

                <div class="panel-footer layer-actions">
                    <button id="btn-add-layer" class="icon-btn" title="New Layer"><i class="fa-solid fa-plus"></i></button>
                    <button id="btn-dup-layer" class="icon-btn" title="Duplicate Layer"><i class="fa-regular fa-copy"></i></button>
                    <button id="btn-merge-down" class="icon-btn" title="Merge Down"><i class="fa-solid fa-angles-down"></i></button>
                    <button id="btn-move-layer-up" class="icon-btn" title="Move Layer Up"><i class="fa-solid fa-arrow-up"></i></button>
                    <button id="btn-move-layer-down" class="icon-btn" title="Move Layer Down"><i class="fa-solid fa-arrow-down"></i></button>
                    <button id="btn-del-layer" class="icon-btn danger" title="Delete Layer"><i class="fa-regular fa-trash-can"></i></button>
                </div>
            </div>

            <!-- History Panel -->
            <div class="panel history-panel">
                <div class="panel-header">
                    <span><i class="fa-solid fa-clock-rotate-left"></i> History</span>
                    <button id="btn-clear-history" class="text-btn">Clear</button>
                </div>
                <div class="history-list" id="history-list">
                    <!-- Populated dynamically by history.js -->
                </div>
            </div>
        </aside>
    </main>

    <!-- Hidden File Inputs -->
    <input type="file" id="file-open-input" accept="image/*" class="hidden">
    <input type="file" id="file-layer-input" accept="image/*" class="hidden">

    <!-- Modal: New Project / Resize Canvas -->
    <div id="modal-dimensions" class="modal-backdrop hidden">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modal-dim-title">New Document</h3>
                <button id="modal-dim-close" class="icon-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Preset</label>
                    <select id="dim-preset">
                        <option value="800x600">Standard (800 × 600)</option>
                        <option value="1280x720">YouTube Thumbnail (1280 × 720)</option>
                        <option value="1920x1080">Full HD (1920 × 1080)</option>
                        <option value="1080x1080">Instagram Post (1080 × 1080)</option>
                        <option value="1080x1920">Shorts / Reels (1080 × 1920)</option>
                        <option value="custom">Custom</option>
                    </select>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Width (px)</label>
                        <input type="number" id="dim-width" min="16" max="4096" value="800">
                    </div>
                    <div class="form-group">
                        <label>Height (px)</label>
                        <input type="number" id="dim-height" min="16" max="4096" value="600">
                    </div>
                </div>
                <div class="form-group" id="dim-bg-group">
                    <label>Background Contents</label>
                    <select id="dim-bg">
                        <option value="white">White</option>
                        <option value="transparent">Transparent</option>
                        <option value="black">Black</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button id="modal-dim-cancel" class="action-btn secondary">Cancel</button>
                <button id="modal-dim-confirm" class="action-btn primary">Create</button>
            </div>
        </div>
    </div>

    <!-- Modal: Text Input -->
    <div id="modal-text" class="modal-backdrop hidden">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Add Text</h3>
                <button id="modal-text-close" class="icon-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Text Content</label>
                    <input type="text" id="text-input-value" placeholder="Enter your text here..." autocomplete="off">
                </div>
            </div>
            <div class="modal-footer">
                <button id="modal-text-cancel" class="action-btn secondary">Cancel</button>
                <button id="modal-text-confirm" class="action-btn primary">Place Text</button>
            </div>
        </div>
    </div>

    <!-- Scripts in Dependency Order -->
    <script src="./js/utils.js"></script>
    <script src="./js/history.js"></script>
    <script src="./js/layers.js"></script>
    <script src="./js/adjustments.js"></script>
    <script src="./js/tools.js"></script>
    <script src="./js/app.js"></script>
</body>
</html>
