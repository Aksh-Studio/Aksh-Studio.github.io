<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled - Aksh Documents</title>
    <link rel="icon" type="image/png" href="../../assets/docs-logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="../../../../style.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.21/mammoth.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html-docx-js@0.3.1/dist/html-docx.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            --editor-bg: #f3f4f6;
            --page-bg: #ffffff;
            --toolbar-bg: #ffffff;
            --toolbar-border: #e2e8f0;
            --btn-hover: #f1f5f9;
        }

        body.dark-theme {
            --editor-bg: #0f172a;
            --page-bg: #1e293b;
            --toolbar-bg: #1e293b;
            --toolbar-border: #334155;
            --btn-hover: #334155;
            color: #e2e8f0;
        }

        body { margin: 0; background: var(--editor-bg); height: 100vh; display: flex; flex-direction: column; overflow: hidden; font-family: 'Inter', sans-serif; }

        /* Header Area */
        .doc-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: var(--toolbar-bg); border-bottom: 1px solid var(--toolbar-border); }
        .doc-meta { display: flex; align-items: center; gap: 15px; }
        .doc-meta img { width: 36px; height: 36px; border-radius: 6px; }
        .doc-title-input { font-size: 18px; font-weight: 600; border: 1px solid transparent; background: transparent; color: inherit; padding: 4px 8px; border-radius: 4px; outline: none; width: 250px; font-family: 'Inter', sans-serif; }
        .doc-title-input:hover, .doc-title-input:focus { border-color: #128C7E; background: var(--btn-hover); }
        .save-status { font-size: 12px; color: #888; display: flex; align-items: center; gap: 4px; padding-left: 8px; }
        
        .doc-actions { display: flex; align-items: center; gap: 10px; }
        .btn-action { display: flex; align-items: center; gap: 6px; padding: 8px 14px; border: none; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-open { background: var(--btn-hover); color: inherit; border: 1px solid var(--toolbar-border); }
        .btn-save { background: #128C7E; color: white; }
        .btn-save:hover { background: #0f7669; }
        .btn-export { background: #3b82f6; color: white; }
        
        /* MS Word Style Ribbon Toolbar */
        .toolbar { display: flex; gap: 5px; padding: 8px 20px; background: var(--toolbar-bg); border-bottom: 1px solid var(--toolbar-border); flex-wrap: wrap; align-items: center; }
        .tool-btn { background: transparent; border: none; width: 32px; height: 32px; border-radius: 4px; cursor: pointer; display: flex; justify-content: center; align-items: center; color: inherit; transition: 0.2s; }
        .tool-btn:hover { background: var(--btn-hover); }
        .tool-divider { width: 1px; height: 24px; background: var(--toolbar-border); margin: 0 5px; }
        
        .tool-select { background: transparent; border: 1px solid var(--toolbar-border); color: inherit; padding: 4px 8px; border-radius: 4px; font-size: 13px; cursor: pointer; outline: none; }
        .tool-select:hover { background: var(--btn-hover); }
        .color-picker-wrapper { position: relative; display: inline-block; width: 32px; height: 32px; }
        .color-picker { opacity: 0; position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: pointer; }
        .color-icon { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; pointer-events: none; border-bottom: 3px solid #000; box-sizing: border-box;}
        body.dark-theme .color-icon { border-bottom-color: #fff; }

        /* Editor Canvas (A4 Dimensions) */
        .editor-wrapper { flex: 1; overflow-y: auto; padding: 40px 20px; display: flex; justify-content: center; }
        .page { background: var(--page-bg); width: 100%; max-width: 816px; min-height: 1056px; padding: 96px; box-sizing: border-box; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid var(--toolbar-border); outline: none; font-family: Arial, sans-serif; font-size: 11pt; line-height: 1.6; color: inherit; }
        
        body.dark-theme .page { box-shadow: 0 4px 20px rgba(0,0,0,0.6); }

        /* Images and Tables inside Editor */
        .page img { max-width: 100%; height: auto; cursor: pointer; border-radius: 4px; }
        .page table { border-collapse: collapse; width: 100%; margin-bottom: 15px; }
        .page table, .page th, .page td { border: 1px solid var(--toolbar-border); }
        .page th, .page td { padding: 8px; text-align: left; }
        
        /* Dropdown Menus */
        .dropdown { position: relative; display: inline-block; }
        .dropdown-content { display: none; position: absolute; background-color: var(--page-bg); min-width: 160px; box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2); z-index: 1; border-radius: 6px; border: 1px solid var(--toolbar-border); overflow: hidden; }
        .dropdown:hover .dropdown-content { display: block; }
        .dropdown-item { padding: 10px 16px; color: inherit; text-decoration: none; display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 13px; font-weight: 500;}
        .dropdown-item:hover { background-color: var(--btn-hover); }

        #file-input { display: none; }
        #image-input { display: none; }
    </style>
</head>
<body>

    <header class="doc-header">
        <div class="doc-meta">
            <a href="../../index.html" title="Back to Office Hub">
                <img src="../../assets/docs-logo.png" alt="Aksh Documents" onerror="this.src='../../../../aksh-logo.png'">
            </a>
            <div>
                <input type="text" id="document-title" class="doc-title-input" value="Untitled Document">
                <div class="save-status" id="save-status">
                    <span class="material-symbols-rounded" style="font-size: 14px;">cloud_off</span> Local Workspace
                </div>
            </div>
        </div>

        <div class="doc-actions">
            <div class="dropdown">
                <button class="btn-action btn-open">
                    <span class="material-symbols-rounded" style="font-size: 18px;">folder_open</span> File
                </button>
                <div class="dropdown-content">
                    <div class="dropdown-item" id="btn-open-ad"><span class="material-symbols-rounded">description</span> Open Aksh Doc (.ad)</div>
                    <div class="dropdown-item" id="btn-open-docx"><span class="material-symbols-rounded">dock</span> Import MS Word (.docx)</div>
                </div>
            </div>

            <div class="dropdown">
    <button class="btn-action btn-export">
        <span class="material-symbols-rounded" style="font-size: 18px;">ios_share</span> Export
    </button>
    <div class="dropdown-content">
        <div class="dropdown-item" id="btn-export-docx"><span class="material-symbols-rounded">dock</span> MS Word (.docx)</div>
        <div class="dropdown-item" id="btn-export-pdf"><span class="material-symbols-rounded">picture_as_pdf</span> PDF Document (.pdf)</div>
        <div class="dropdown-item" id="btn-export-html"><span class="material-symbols-rounded">html</span> Web Page (.html)</div>
        <div class="dropdown-item" id="btn-export-txt"><span class="material-symbols-rounded">article</span> Plain Text (.txt)</div>
    </div>
</div>
            <button class="btn-action btn-save" id="btn-save">
                <span class="material-symbols-rounded" style="font-size: 18px;">save</span> Save (.ad)
            </button>
            <img src="https://ui-avatars.com/api/?name=User&background=00a884&color=fff" id="profile-pic" alt="Profile" style="width:32px; height:32px; border-radius:50%; margin-left: 10px;">
        </div>
    </header>

    <div class="toolbar">
        <select class="tool-select" id="font-family">
            <option value="Arial">Arial</option>
            <option value="Times New Roman">Times New Roman</option>
            <option value="Courier New">Courier New</option>
            <option value="Georgia">Georgia</option>
            <option value="Verdana">Verdana</option>
            <option value="Inter">Inter</option>
        </select>

        <select class="tool-select" id="font-size">
            <option value="1">Small (8pt)</option>
            <option value="2">Normal (10pt)</option>
            <option value="3" selected>Default (12pt)</option>
            <option value="4">Large (14pt)</option>
            <option value="5">Huge (18pt)</option>
            <option value="6">Title (24pt)</option>
        </select>
        
        <div class="tool-divider"></div>

        <button class="tool-btn" data-command="bold" title="Bold (Ctrl+B)"><span class="material-symbols-rounded">format_bold</span></button>
        <button class="tool-btn" data-command="italic" title="Italic (Ctrl+I)"><span class="material-symbols-rounded">format_italic</span></button>
        <button class="tool-btn" data-command="underline" title="Underline (Ctrl+U)"><span class="material-symbols-rounded">format_underlined</span></button>
        <button class="tool-btn" data-command="strikeThrough" title="Strikethrough"><span class="material-symbols-rounded">format_strikethrough</span></button>
        
        <div class="tool-divider"></div>

        <div class="color-picker-wrapper" title="Text Color">
            <input type="color" class="color-picker" id="text-color" value="#000000">
            <div class="color-icon" id="text-color-icon"><span class="material-symbols-rounded">format_color_text</span></div>
        </div>

        <div class="color-picker-wrapper" title="Highlight Color">
            <input type="color" class="color-picker" id="bg-color" value="#ffff00">
            <div class="color-icon" id="bg-color-icon" style="border-bottom-color: #ffff00;"><span class="material-symbols-rounded">format_color_fill</span></div>
        </div>

        <div class="tool-divider"></div>
        
        <button class="tool-btn" data-command="insertUnorderedList" title="Bullet List"><span class="material-symbols-rounded">format_list_bulleted</span></button>
        <button class="tool-btn" data-command="insertOrderedList" title="Numbered List"><span class="material-symbols-rounded">format_list_numbered</span></button>
        
        <div class="tool-divider"></div>
        
        <button class="tool-btn" data-command="justifyLeft" title="Align Left"><span class="material-symbols-rounded">format_align_left</span></button>
        <button class="tool-btn" data-command="justifyCenter" title="Align Center"><span class="material-symbols-rounded">format_align_center</span></button>
        <button class="tool-btn" data-command="justifyRight" title="Align Right"><span class="material-symbols-rounded">format_align_right</span></button>
        <button class="tool-btn" data-command="justifyFull" title="Justify"><span class="material-symbols-rounded">format_align_justify</span></button>
        
        <div class="tool-divider"></div>
        
        <button class="tool-btn" id="btn-insert-image" title="Insert Image"><span class="material-symbols-rounded">image</span></button>
        <button class="tool-btn" id="btn-insert-table" title="Insert Table"><span class="material-symbols-rounded">table</span></button>
        <button class="tool-btn" data-command="removeFormat" title="Clear Formatting"><span class="material-symbols-rounded">format_clear</span></button>
    </div>

    <div class="editor-wrapper" id="editor-container">
        <div id="editor" class="page" contenteditable="true" spellcheck="true"></div>
    </div>

    <input type="file" id="file-input" accept=".ad,.docx">
    <input type="file" id="image-input" accept="image/*">

    <script type="module" src="app.js"></script>
</body>
</html>
